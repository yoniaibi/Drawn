    <script>
      window.onerror = function(msg, src, line, col, err) {

      window.addEventListener('unhandledrejection', function(e) {

    <div id="loading-msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#F472B6;font-family:sans-serif;font-size:18px;letter-spacing:2px">DRAWN</div>
    <div id="root"></div>
    <script>
      // Hide loading message once React mounts something
      var _orig = document.getElementById('root');
      var _obs = new MutationObserver(function() {
        var msg = document.getElementById('loading-msg');
        if (msg && document.getElementById('root').children.length > 0) {
          msg.style.display = 'none';
          _obs.disconnect();
        }
      });
      _obs.observe(document.getElementById('root'), { childList: true });
    </script>
