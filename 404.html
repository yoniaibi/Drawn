<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DRAWN</title>
<script>
  var seg = window.location.pathname;
  // Store the intended path so the app can restore it after load
  if (seg !== '/Drawn/' && seg !== '/Drawn/index.html') {
    sessionStorage.setItem('__spa_path', seg + window.location.search);
  }
  // Always redirect to the webapp
  window.location.replace('/Drawn/webapp/');
</script>
</head>
<body></body>
</html>
