<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DRAWN</title>
<script>
  var seg = window.location.pathname;
  // If it looks like an app route, restore and redirect to app
  if (seg !== '/Drawn/' && seg !== '/Drawn/index.html') {
    sessionStorage.setItem('__spa_path', seg + window.location.search);
    window.location.replace('/Drawn/app-preview.html');
  }
</script>
</head>
<body></body>
</html>
